[project]
name = "social-account-service"
version = "0.1.0"
description = "Social account service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "structlog>=26.1.0",
    "redis>=5.2.1",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.15.21", "ty>=0.0.59"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../shared"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["B008", "E501"]

[tool.ty]

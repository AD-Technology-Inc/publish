networks:
  app:

volumes:
  identity-db-data:
  social-post-db-data:
  social-account-db-data:
  social-publish-db-data:
  redis-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

services:
  # =========================
  # Traefik reverse proxy
  # src: https://doc.traefik.io/traefik/getting-started/docker
  # =========================
  traefik:
    image: traefik:v3.6.8
    container_name: traefik
    restart: unless-stopped
    networks:
      - app
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yml
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 🌐 FRONTEND
  # =========================
  client:
    build: ../client
    volumes:
      - ../client:/app
      - /app/node_modules
    networks:
      - app
    develop:
      watch:
        - action: rebuild
          path: ../client/package.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          memory: 256m

  # =========================
  # ☁️ GATEWAY
  # =========================
  gateway:
    build: ../gateway/app
    volumes:
      - ../gateway/app:/app
      - /app/.venv
    networks:
      - app
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=gateway
    depends_on:
      identity-service:
        condition: service_started
      social-account-service:
        condition: service_started
      social-post-service:
        condition: service_started
      social-publish-service:
        condition: service_started
      otel-collector:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`gateway.localhost`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8000"
      - "traefik.http.routers.gateway.middlewares=gateway-cors@file"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 🔐 Identity Service
  # =========================
  identity-service:
    build: ../services/identity-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://identity_user:identity_pass@identity-db:5432/identity_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=identity-service
    volumes:
      - ../services/identity-service:/app
      - /app/.venv
    networks:
      - app
    develop:
      watch:
        - action: rebuild
          path: ../services/identity-service/pyproject.toml
    depends_on:
      identity-db:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  identity-db:
    image: postgres:18-trixie
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_pass
    volumes:
      - identity-db-data:/var/lib/postgresql
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # ⚙️ Social Publish Service
  # =========================
  social-publish-service:
    build:
      context: ..
      dockerfile: services/social-publish-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://social_publish_user:social_publish_pass@social-publish-db:5432/social_publish_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=social-publish-service
    volumes:
      - ../services/social-publish-service:/app/services/social-publish-service
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
      social-publish-db:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  social-publish-worker:
    build:
      context: ..
      dockerfile: services/social-publish-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://social_publish_user:social_publish_pass@social-publish-db:5432/social_publish_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=social-publish-worker
      # Set OTEL_SDK_DISABLED=true to disable telemetry (e.g. unit tests)
      # - OTEL_SDK_DISABLED=true
    volumes:
      - ../services/social-publish-service:/app/services/social-publish-service
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
      social-publish-db:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    command: ["uv", "run", "python", "worker.py"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256m
        reservations:
          memory: 128m

  social-publish-db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: social_publish_db
      POSTGRES_USER: social_publish_user
      POSTGRES_PASSWORD: social_publish_pass
    volumes:
      - social-publish-db-data:/var/lib/postgresql
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_publish_user -d social_publish_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # ⚙️ Social Post Service
  # =========================
  social-post-service:
    build:
      context: ..
      dockerfile: services/social-post-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://social_post_user:social_post_pass@social-post-db:5432/social_post_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=social-post-service
    volumes:
      - ../services/social-post-service:/app/services/social-post-service
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
      social-post-db:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  social-post-worker:
    build:
      context: ..
      dockerfile: services/social-post-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://social_post_user:social_post_pass@social-post-db:5432/social_post_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=social-post-worker
    volumes:
      - ../services/social-post-service:/app/services/social-post-service
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
      social-post-db:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    command: ["uv", "run", "python", "worker.py"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256m
        reservations:
          memory: 128m

  social-post-db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: social_post_db
      POSTGRES_USER: social_post_user
      POSTGRES_PASSWORD: social_post_pass
    volumes:
      - social-post-db-data:/var/lib/postgresql
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_post_user -d social_post_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # ⚙️ Social Account Service
  # =========================
  social-account-service:
    build:
      context: ..
      dockerfile: services/social-account-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://social_account_user:social_account_pass@social-account-db:5432/social_account_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=social-account-service
    volumes:
      - ../services/social-account-service:/app/services/social-account-service
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
      social-account-db:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  social-account-worker:
    build:
      context: ..
      dockerfile: services/social-account-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://social_account_user:social_account_pass@social-account-db:5432/social_account_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=social-account-worker
    volumes:
      - ../services/social-account-service:/app/services/social-account-service
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
      social-account-db:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    command: ["uv", "run", "python", "worker.py"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256m
        reservations:
          memory: 128m

  social-account-db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: social_account_db
      POSTGRES_USER: social_account_user
      POSTGRES_PASSWORD: social_account_pass
    volumes:
      - social-account-db-data:/var/lib/postgresql
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_account_user -d social_account_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 💾 Redis Server
  # =========================
  redis:
    image: redis:8.6.0-alpine3.23
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 📡 OpenTelemetry Collector
  # Receives OTLP from all services and fans out to:
  #   Traces  → Tempo
  #   Metrics → Prometheus (scrape endpoint :8889)
  #   Logs    → Loki (OTLP push)
  # =========================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: otel-collector
    restart: unless-stopped
    networks:
      - app
    command: ["--config=/etc/otelcol/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (services → collector)
      - "4318:4318"   # OTLP HTTP (services → collector)
      - "8888:8888"   # Collector internal metrics (Prometheus scrapes this)
      - "8889:8889"   # Collector Prometheus exporter (app metrics)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 📊 Prometheus
  # Scrapes OTel Collector and service /metrics endpoints.
  # =========================
  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: prometheus
    restart: unless-stopped
    networks:
      - app
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 📋 Loki (Log aggregation)
  # Receives OTLP logs from OTel Collector and provides
  # a queryable log store for Grafana.
  # =========================
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    networks:
      - app
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 🔭 Tempo (Distributed tracing)
  # Receives OTLP traces from OTel Collector.
  # =========================
  tempo:
    image: grafana/tempo:2.8.0
    container_name: tempo
    restart: unless-stopped
    networks:
      - app
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana datasource)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

  # =========================
  # 📈 Grafana (Dashboards)
  # Pre-provisioned with Loki, Tempo, and Prometheus datasources.
  # Access at http://localhost:3000 (admin / admin)
  # =========================
  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    restart: unless-stopped
    networks:
      - app
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
        reservations:
          memory: 128m

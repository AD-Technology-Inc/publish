global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: publish-otel-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics

  - job_name: identity-service
    static_configs:
      - targets: ["identity-service:8000"]
    metrics_path: /metrics

  - job_name: social-account-service
    static_configs:
      - targets: ["social-account-service:8000"]
    metrics_path: /metrics

  - job_name: social-post-service
    static_configs:
      - targets: ["social-post-service:8000"]
    metrics_path: /metrics

  - job_name: social-publish-service
    static_configs:
      - targets: ["social-publish-service:8000"]
    metrics_path: /metrics
